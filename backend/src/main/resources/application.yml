spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mysite}
    username: ${DB_USER:mysite}
    password: ${DB_PASSWORD:mysite}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  forward-headers-strategy: native
  error:
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  author-password: ${AUTHOR_PASSWORD:pswed}
